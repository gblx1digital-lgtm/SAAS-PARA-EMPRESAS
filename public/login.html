<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar — Prospecção de Sites</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><span class="brand-mark">P</span> Prospecção <span class="brand-sub">de Sites</span></div>
    <h1>Entrar</h1>
    <form id="login-form">
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p class="form-error" id="login-error" hidden></p>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
